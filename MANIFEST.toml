[long_description_i18n]
de = """
Dieses Plugin stellt spezielle Album- und Titelvariablen für die Verwendung in Benennungsskripten bereit. Es basiert auf
dem Plugin „Album Artist Extension“, erweitert jedoch die Funktionalität um Titelkünstler. Beachten Sie, dass es nicht als
direkter Ersatz für das Plugin „Album Artist Extension“ verwendet werden kann, da die Variablen mit unterschiedlichen Namen
bereitgestellt werden.  Bei einem Wechsel zu diesem Plugin müssen daher Änderungen an bestehenden Skripten vorgenommen werden.
"""

fr = "Ce plugin fournit des variables spécifiques aux albums et aux pistes, destinées à être utilisées dans les scripts de nommage."
